<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="1" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.12" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#047857" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="15" width="950" height="42" rx="6" fill="#0f172a" />
  <text x="500" y="42" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">CabinGuard-ADI: In-Cabin Physical Hardware Wiring &amp; Bus Topology</text>

  <!-- Column 1: In-Cabin Sensors -->
  <rect x="25" y="75" width="220" height="505" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="25" y="75" width="220" height="32" rx="8" fill="#334155" />
  <text x="135" y="96" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">In-Cabin Sensor Suite</text>

  <!-- Sensor 1: Camera -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <rect width="190" height="75" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="12" y="22" fill="#1e3a8a" font-size="12" font-weight="bold">NIR Optical Camera</text>
    <text x="12" y="40" fill="#475569" font-size="10">850 nm Active Ring</text>
    <text x="12" y="55" fill="#475569" font-size="10">1080p @ 60 FPS (UVC)</text>
    <text x="12" y="68" fill="#1d4ed8" font-size="9" font-weight="bold">Face, EAR, Pose, rPPG</text>
  </g>

  <!-- Sensor 2: IMU -->
  <g transform="translate(40, 225)" filter="url(#shadow)">
    <rect width="190" height="75" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="22" fill="#065f46" font-size="12" font-weight="bold">Headrest IMU (MPU6050)</text>
    <text x="12" y="40" fill="#475569" font-size="10">6-Axis Accel/Gyro (100 Hz)</text>
    <text x="12" y="55" fill="#475569" font-size="10">I2C Fast Mode (400 kHz)</text>
    <text x="12" y="68" fill="#047857" font-size="9" font-weight="bold">2-6 Hz Clonic Tremor</text>
  </g>

  <!-- Sensor 3: FSR -->
  <g transform="translate(40, 330)" filter="url(#shadow)">
    <rect width="190" height="75" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
    <text x="12" y="22" fill="#92400e" font-size="12" font-weight="bold">Seatback FSR Mat</text>
    <text x="12" y="40" fill="#475569" font-size="10">Thoracic Pressure Array</text>
    <text x="12" y="55" fill="#475569" font-size="10">Analog Voltage Divider</text>
    <text x="12" y="68" fill="#b45309" font-size="9" font-weight="bold">Postural Slump (PSI)</text>
  </g>

  <!-- Sensor 4: Grip -->
  <g transform="translate(40, 435)" filter="url(#shadow)">
    <rect width="190" height="75" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="12" y="22" fill="#5b21b6" font-size="12" font-weight="bold">Capacitive Steering Grip</text>
    <text x="12" y="40" fill="#475569" font-size="10">Dual-Zone Conductive Rim</text>
    <text x="12" y="55" fill="#475569" font-size="10">Charge-Transfer Sensing</text>
    <text x="12" y="68" fill="#6d28d9" font-size="9" font-weight="bold">Hands-On / Hands-Off</text>
  </g>

  <!-- Column 2: Sensor Gateway (ESP32) -->
  <g transform="translate(295, 220)" filter="url(#shadow)">
    <rect width="165" height="300" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <rect width="165" height="32" rx="8" fill="#475569" />
    <text x="82" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">ESP32 Gateway Node</text>

    <!-- Pins -->
    <rect x="12" y="45" width="140" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="20" y="62" fill="#065f46" font-size="10" font-weight="bold">I2C Master (SDA/SCL)</text>
    <text x="20" y="76" fill="#64748b" font-size="9">GPIO 21 / 22 @ 400 kHz</text>

    <rect x="12" y="100" width="140" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="20" y="117" fill="#92400e" font-size="10" font-weight="bold">ADC1 Channel 0</text>
    <text x="20" y="131" fill="#64748b" font-size="9">12-bit Thoracic Voltage</text>

    <rect x="12" y="155" width="140" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="20" y="172" fill="#5b21b6" font-size="10" font-weight="bold">Touch Channels T0/T1</text>
    <text x="20" y="186" fill="#64748b" font-size="9">Capacitive Thresholding</text>

    <rect x="12" y="225" width="140" height="50" rx="4" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="20" y="244" fill="#0f172a" font-size="10" font-weight="bold">USB Serial Streamer</text>
    <text x="20" y="258" fill="#475569" font-size="9">CDC Virtual COM Port</text>
    <text x="20" y="269" fill="#1d4ed8" font-size="8.5" font-weight="bold">115200 Baud JSON Packet</text>
  </g>

  <!-- Wiring from Sensors to ESP32 -->
  <!-- IMU -> ESP32 I2C -->
  <path d="M 230 262 L 295 262" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="262" y="254" text-anchor="middle" fill="#047857" font-size="9" font-weight="bold">I2C</text>

  <!-- FSR -> ESP32 ADC -->
  <path d="M 230 367 L 260 367 L 260 340 L 295 340" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="262" y="380" text-anchor="middle" fill="#b45309" font-size="9" font-weight="bold">ADC</text>

  <!-- Grip -> ESP32 Touch -->
  <path d="M 230 472 L 275 472 L 275 395 L 295 395" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="262" y="485" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="bold">Touch</text>

  <!-- Column 3: Edge Host Controller -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="210" height="420" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
    <rect width="210" height="35" rx="8" fill="#0284c7" />
    <text x="105" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Edge AI Host Controller</text>
    <text x="105" y="50" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="bold">NVIDIA Jetson / Automotive ECU</text>

    <!-- Host Modules -->
    <rect x="15" y="65" width="180" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="25" y="83" fill="#1e293b" font-size="11" font-weight="bold">Vision Engine</text>
    <text x="25" y="97" fill="#64748b" font-size="9.5">MediaPipe Mesh (EAR, Pose)</text>
    <text x="25" y="108" fill="#64748b" font-size="9.5">POS rPPG Pulse Extraction</text>

    <rect x="15" y="125" width="180" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="25" y="143" fill="#1e293b" font-size="11" font-weight="bold">DSP &amp; Feature Extraction</text>
    <text x="25" y="157" fill="#64748b" font-size="9.5">Welch FFT (2-6 Hz SER)</text>
    <text x="25" y="168" fill="#64748b" font-size="9.5">FSR Slump Index (PSI)</text>

    <rect x="15" y="185" width="180" height="55" rx="4" fill="#eff6ff" stroke="#93c5fd" />
    <text x="25" y="203" fill="#1d4ed8" font-size="11" font-weight="bold">Watchdog &amp; Classifier</text>
    <text x="25" y="217" fill="#3b82f6" font-size="9.5">Cross-Sensor Plausibility (Alg. 1)</text>
    <text x="25" y="229" fill="#3b82f6" font-size="9.5">Bayesian Posterior Fusion</text>

    <rect x="15" y="250" width="180" height="55" rx="4" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="268" fill="#b91c1c" font-size="11" font-weight="bold">UNECE R157 MRM FSM</text>
    <text x="25" y="282" fill="#ef4444" font-size="9.5">Phase 1-4 State Execution</text>
    <text x="25" y="294" fill="#ef4444" font-size="9.5">Target a = -3.2 m/s²</text>

    <rect x="15" y="315" width="180" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="25" y="333" fill="#1e293b" font-size="11" font-weight="bold">CAN-FD Controller</text>
    <text x="25" y="347" fill="#64748b" font-size="9.5">SecOC AES-128 CMAC</text>

    <rect x="15" y="365" width="180" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="25" y="383" fill="#1e293b" font-size="11" font-weight="bold">V2X Telematics Client</text>
    <text x="25" y="397" fill="#64748b" font-size="9.5">76-Byte Anonymized MEC</text>
  </g>

  <!-- Wiring from Camera directly to Edge Host -->
  <path d="M 230 157 L 520 157" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <rect x="330" y="143" width="115" height="18" rx="3" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="387" y="156" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="bold">USB 3.0 UVC Video</text>

  <!-- Wiring from ESP32 to Edge Host -->
  <path d="M 460 460 L 490 460 L 490 280 L 520 280" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />
  <rect x="440" y="345" width="100" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="490" y="358" text-anchor="middle" fill="#334155" font-size="9" font-weight="bold">USB CDC Serial</text>

  <!-- CAN-FD Bus Trunk Line (Red Bar) -->
  <rect x="765" y="105" width="8" height="340" rx="4" fill="#b91c1c" />
  <text x="769" y="95" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="bold">CAN-FD Bus Trunk</text>

  <!-- Connection from Jetson to CAN Trunk -->
  <path d="M 730 336 L 765 336" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="747" y="330" text-anchor="middle" fill="#b91c1c" font-size="8" font-weight="bold">MCP2515</text>

  <!-- Column 4: Vehicle Actuators & Telematics -->
  <g transform="translate(805, 100)">
    <!-- EBS -->
    <g transform="translate(0, 10)" filter="url(#shadow)">
      <rect width="170" height="60" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="22" fill="#991b1b" font-size="11" font-weight="bold">Electronic Braking (EBS)</text>
      <text x="12" y="38" fill="#475569" font-size="10">Target: a = -3.2 m/s²</text>
      <text x="12" y="50" fill="#dc2626" font-size="9" font-weight="bold">Autonomous Deceleration</text>
    </g>
    <!-- Branch from CAN trunk to EBS -->
    <path d="M 773 140 L 805 140" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)" />

    <!-- EPS -->
    <g transform="translate(0, 90)" filter="url(#shadow)">
      <rect width="170" height="60" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="22" fill="#991b1b" font-size="11" font-weight="bold">Electric Steering (EPS)</text>
      <text x="12" y="38" fill="#475569" font-size="10">Lateral Trajectory Control</text>
      <text x="12" y="50" fill="#dc2626" font-size="9" font-weight="bold">Highway Shoulder Pullover</text>
    </g>
    <!-- Branch from CAN trunk to EPS -->
    <path d="M 773 220 L 805 220" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)" />

    <!-- Hazards & Locks -->
    <g transform="translate(0, 170)" filter="url(#shadow)">
      <rect width="170" height="60" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="22" fill="#991b1b" font-size="11" font-weight="bold">Chassis Hazards &amp; Locks</text>
      <text x="12" y="38" fill="#475569" font-size="10">Hazard Flashers (2.0 Hz)</text>
      <text x="12" y="50" fill="#dc2626" font-size="9" font-weight="bold">Standstill Door Unlock</text>
    </g>
    <!-- Branch from CAN trunk to Hazards -->
    <path d="M 773 300 L 805 300" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)" />

    <!-- V2V DENM -->
    <g transform="translate(0, 260)" filter="url(#shadow)">
      <rect width="170" height="70" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="12" y="20" fill="#1e40af" font-size="11" font-weight="bold">V2V ETSI DENM (5.9 GHz)</text>
      <text x="12" y="36" fill="#475569" font-size="9.5">Cause Code 6 (Emg Stop)</text>
      <text x="12" y="49" fill="#475569" font-size="9.5">IEEE 1609.2 Signed</text>
      <text x="12" y="62" fill="#1d4ed8" font-size="9" font-weight="bold">Trailing Traffic Warning</text>
    </g>

    <!-- V2N eCall -->
    <g transform="translate(0, 350)" filter="url(#shadow)">
      <rect width="170" height="70" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="20" fill="#065f46" font-size="11" font-weight="bold">V2N NG-eCall (5G IMS)</text>
      <text x="12" y="36" fill="#475569" font-size="9.5">76-Byte Anonymized MEC</text>
      <text x="12" y="49" fill="#475569" font-size="9.5">Etiology Code + Conf.</text>
      <text x="12" y="62" fill="#047857" font-size="9" font-weight="bold">To 112/911 PSAP Dispatch</text>
    </g>
  </g>

  <!-- Wiring from Host to V2X modules -->
  <path d="M 730 385 L 755 385 L 755 490 L 805 490" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
  <path d="M 755 400 L 805 400" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="765" y="475" text-anchor="middle" fill="#1d4ed8" font-size="8" font-weight="bold" rotate="90">Ethernet / SPI</text>
</svg>
