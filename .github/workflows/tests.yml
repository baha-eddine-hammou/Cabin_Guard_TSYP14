name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "prototype[dev]" python-can cantools
      - name: Unit, pipeline and fault tests
        working-directory: prototype
        run: python -m pytest -q
      - name: Manuscript rules
        run: python tools/check_manuscript.py IEEE_Research_Paper_CabinGuard.tex
